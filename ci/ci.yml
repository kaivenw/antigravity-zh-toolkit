name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: Self test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cross-platform self test
        run: python tests/selftest.py

      - name: Unix launcher
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n ag-zh
          ./ag-zh help
          python install.py --help

      - name: Windows PowerShell syntax + launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\ag-zh.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          .\ag-zh.cmd help
          python install.py --help
